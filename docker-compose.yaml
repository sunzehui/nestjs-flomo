services:
  nest-server:
    build: .
    image: nest-server:v0.1
    container_name: nest-server
    restart: always
    # 敏感配置通过 .env 注入，不打进镜像
    env_file:
      - .env
    expose:
      - "3000"
    volumes:
      # 上传的图片与 sqlite 数据库需要持久化，否则容器重建即丢数据
      - uploads-volume:/app/uploads
      - db-volume:/app/src/core/sql

  website:
    build: ../vue3-flomo
    image: flomo-website:v0.1
    container_name: website
    restart: on-failure
    ports:
      - "80:80"
    volumes:
      - ./vhosts.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nest-server

volumes:
  uploads-volume: {}
  db-volume: {}
